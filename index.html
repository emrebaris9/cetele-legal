<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Çetele</title>
    <style>
      :root {
        --bg: #fdfcfb;
        --text: #1a1a1a;
        --muted: #5f5f5f;
        --rule: #e6e2dd;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171615;
          --text: #f2efec;
          --muted: #a8a29c;
          --rule: #322f2c;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 32rem; padding: 3rem 16px; }
      h1 { font-size: 2.2rem; margin: 0 0 .5rem; letter-spacing: -.02em; }
      p { color: var(--muted); margin: 0 0 2rem; }
      nav a {
        display: block;
        padding: 1rem 0;
        border-top: 1px solid var(--rule);
        color: inherit;
        text-decoration: none;
      }
      nav a:last-child { border-bottom: 1px solid var(--rule); }
      nav a:hover { opacity: .65; }
    </style>
  </head>
  <body>
    <main>
      <h1>Çetele</h1>
      <p>Maliyetini, stoğunu ve kayıplarını kontrol altında tut.</p>
      <nav>
        <a href="gizlilik.html">Gizlilik Politikası →</a>
        <a href="kosullar.html">Kullanım Koşulları →</a>
      </nav>
    </main>
  </body>
</html>
